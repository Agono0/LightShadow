# Fast CI checks for LIGHT SHADOW — the PR gate described in AGENTS.md ("Git workflow").
# Full Unity validation (ValidateBatch) is a LOCAL pre-merge requirement — see AGENTS.md
# "Verification". A full Unity CI job can be added later once a GameCI license secret exists.
name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast-checks:
    name: fast-checks (meta pairing, conflict markers, required files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Every tracked asset has a .meta sibling
        run: |
          missing=0
          while IFS= read -r f; do
            case "$f" in *.meta|*.gitkeep) continue ;; esac
            [ -f "$f.meta" ] || { echo "MISSING META: $f"; missing=1; }
          done < <(git ls-files Assets)
          exit $missing

      - name: No merge-conflict markers in tracked text
        run: |
          if grep -rlnE '^(<{7}|={7}$|>{7})' \
              --include='*.cs' --include='*.unity' --include='*.asset' \
              --include='*.prefab' --include='*.md' \
              Assets ProjectSettings Packages Docs *.md; then
            echo "::error::merge-conflict markers found (see files above)"
            exit 1
          fi

      - name: Asset register validates (rows reference real files, no duplicate ids)
        run: python3 Art/pipeline/validate_asset_manifest.py

      - name: Required files and editor version pin
        run: |
          for f in Assets/_Project/Data/GameConfig.asset Packages/manifest.json \
                   ProjectSettings/ProjectVersion.txt; do
            [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          grep -q '6000.4.0f1' ProjectSettings/ProjectVersion.txt \
            || { echo "editor version mismatch (expected 6000.4.0f1)"; exit 1; }
