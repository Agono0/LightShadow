# Player build CI/CD for LIGHT SHADOW — see AGENTS.md "Git workflow".
# Produces a Windows player and SEPARATE Android APKs per ABI (arm64-v8a and
# armeabi-v7a — no universal APK). x86_64 is not offered: Unity 6.4 deprecates
# it (Magic Leap legacy) and throws UnityException when it is targeted.
# Unity Personal license must be configured as repo secrets: UNITY_LICENSE +
# UNITY_EMAIL + UNITY_PASSWORD. See game.ci/docs/github/activation.
name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; main and tag runs always complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only PRs (audit notes, cue sheets, dev-log fragments, READMEs) used
  # to wait ~35 minutes for three Unity players they cannot affect. This job
  # diffs the PR; the build jobs no-op in seconds on docs-only changes while
  # still reporting their required check names as successful. Anything under
  # Assets/, ProjectSettings/, Packages/ or .github/ forces full builds.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | tee /tmp/changed.txt
          if grep -qE '^(Assets|ProjectSettings|Packages|\.github)/' /tmp/changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test-editmode:
    name: test-editmode
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - if: needs.changes.outputs.code == 'true'
        name: Free runner disk space (GameCI editor image + project do not fit otherwise)
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: true
          swap-storage: true

      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      # Library cache mirrors the build jobs so repeat runs stay fast.
      - if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-test-editmode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-test-editmode-

      - if: needs.changes.outputs.code == 'true'
        name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          testMode: EditMode

      # Docs-only PRs still need the required check name to report success.
      - if: needs.changes.outputs.code != 'true'
        run: echo "docs-only change; EditMode tests skipped"

  build-android:
    name: build-android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            method: BuildAndroidArm64Batch
          - abi: armeabi-v7a
            method: BuildAndroidArmV7Batch
    steps:
      - if: needs.changes.outputs.code == 'true'
        name: Free runner disk space (GameCI android image + project do not fit otherwise)
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: true
          swap-storage: true

      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
        with:
          lfs: true

      - if: needs.changes.outputs.code == 'true'
        name: Cache Library (import cache per ABI)
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Android-${{ matrix.abi }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-${{ matrix.abi }}-
            Library-Android-

      - if: needs.changes.outputs.code == 'true'
        name: Cache Gradle dependencies (Maven Central flake shield)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            gradle-android-

      - if: needs.changes.outputs.code == 'true'
        name: Build ${{ matrix.abi }} APK
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: LightShadow.Tools.SceneBuilder.${{ matrix.method }}

      - if: needs.changes.outputs.code == 'true'
        name: Upload ${{ matrix.abi }} APK
        uses: actions/upload-artifact@v7
        with:
          name: LightShadow-android-${{ matrix.abi }}
          path: Builds/Android/${{ matrix.abi }}/LightShadow.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    name: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    steps:
      - if: needs.changes.outputs.code == 'true'
        name: Free runner disk space (GameCI windows-mono image + project do not fit otherwise)
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: true
          swap-storage: true

      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
        with:
          lfs: true

      - if: needs.changes.outputs.code == 'true'
        name: Cache Library (import cache for StandaloneWindows64)
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-StandaloneWindows64-

      - if: needs.changes.outputs.code == 'true'
        name: Build Windows player (StandaloneWindows64, Mono — project default backend)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: auto
          customImage: unityci/editor:ubuntu-6000.4.0f1-windows-mono-4.0.0
          buildMethod: LightShadow.Tools.SceneBuilder.BuildWindowsBatch

      - if: needs.changes.outputs.code == 'true'
        name: Upload Windows player
        uses: actions/upload-artifact@v7
        with:
          name: LightShadow-windows
          path: Builds/Windows/
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: LightShadow-*
          path: artifacts

      # Both APKs are named LightShadow.apk inside their per-ABI artifacts —
      # rename them so release assets are distinguishable.
      - name: Rename APKs per ABI and zip the Windows player folder
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mv "artifacts/LightShadow-android-$abi/LightShadow.apk" "artifacts/LightShadow-$abi.apk"
          done
          cd artifacts/LightShadow-windows
          zip -qr ../LightShadow-windows.zip .
          cd ../..
          ls -la artifacts

      - name: Attach builds to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/LightShadow-windows.zip
            artifacts/LightShadow-arm64-v8a.apk
            artifacts/LightShadow-armeabi-v7a.apk
