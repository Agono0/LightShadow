# Player build CI/CD for LIGHT SHADOW — see AGENTS.md "Git workflow".
# Produces a Windows player and SEPARATE Android APKs per ABI (arm64-v8a and
# armeabi-v7a — no universal APK). x86_64 is not offered: Unity 6.4 deprecates
# it (Magic Leap legacy) and throws UnityException when it is targeted.
# Unity Personal license must be configured as repo secrets: UNITY_LICENSE +
# UNITY_EMAIL + UNITY_PASSWORD. See game.ci/docs/github/activation.
name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; main and tag runs always complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only PRs (audit notes, cue sheets, dev-log fragments, READMEs) used
  # to wait ~35 minutes for three Unity players they cannot affect. This job
  # diffs the PR; the build jobs no-op in seconds on docs-only changes while
  # still reporting their required check names as successful. Anything under
  # Assets/, ProjectSettings/, Packages/ or .github/ forces full builds.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      player: ${{ steps.filter.outputs.player }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "player=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | tee /tmp/changed.txt
          # code: anything Unity compiles or imports (EditMode tests run).
          if grep -qE '^(Assets|ProjectSettings|Packages|\.github)/' /tmp/changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # player: code changes that can reach a player build. EditMode test
          # files (Assets/_Project/Tests/) are Editor-only and never ship, so
          # a PR that touches only those skips the three player builds. The
          # required check names still report success (no-op jobs).
          if grep -E '^(Assets|ProjectSettings|Packages|\.github)/' /tmp/changed.txt \
              | grep -qvE '^Assets/_Project/Tests/'; then
            echo "player=true" >> "$GITHUB_OUTPUT"
          else
            echo "player=false" >> "$GITHUB_OUTPUT"
          fi

  test-editmode:
    name: test-editmode
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - if: needs.changes.outputs.code == 'true'
        name: Free runner disk space (fast parallel rm; apt purge only if still short)
        run: |
          df -h / | tail -1
          sudo swapoff -a || true
          ( sudo rm -rf /usr/local/lib/android & \
            sudo rm -rf /usr/share/dotnet & \
            sudo rm -rf /opt/ghc /usr/local/.ghcup & \
            sudo rm -rf /usr/share/swift /usr/local/share/boost & \
            docker system prune -af >/dev/null 2>&1 & \
            wait )
          avail_kb=$(df --output=avail / | tail -1)
          df -h / | tail -1
          if [ "$avail_kb" -lt 26000000 ]; then
            echo "Still under ~25 GB free: falling back to the slow apt cleanup"
            sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri >/dev/null 2>&1 || true
            sudo apt-get autoremove -y >/dev/null 2>&1 || true
            df -h / | tail -1
          fi


      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      # Library cache policy (all jobs): PRs only RESTORE (they can read the
      # caches main saved); main pushes SAVE a fresh entry after a green run.
      # Before: every PR ref saved its own 1.5-3 GB Library entries, which
      # pushed the repo past the 10 GB cache quota and evicted main's, and the
      # fixed key meant a saved cache was never refreshed.
      - if: needs.changes.outputs.code == 'true'
        name: Restore Library cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-test-editmode-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}
          restore-keys: |
            Library-test-editmode-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-test-editmode-

      - if: needs.changes.outputs.code == 'true'
        name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          testMode: EditMode

      - if: success() && needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main'
        name: Save Library cache (main only)
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-test-editmode-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}

      # Docs-only PRs still need the required check name to report success.
      - if: needs.changes.outputs.code != 'true'
        run: echo "docs-only change; EditMode tests skipped"

  build-android:
    name: build-android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            method: BuildAndroidArm64Batch
          - abi: armeabi-v7a
            method: BuildAndroidArmV7Batch
    steps:
      - if: needs.changes.outputs.player == 'true'
        name: Free runner disk space (fast parallel rm; apt purge only if still short)
        run: |
          df -h / | tail -1
          sudo swapoff -a || true
          ( sudo rm -rf /usr/local/lib/android & \
            sudo rm -rf /usr/share/dotnet & \
            sudo rm -rf /opt/ghc /usr/local/.ghcup & \
            sudo rm -rf /usr/share/swift /usr/local/share/boost & \
            docker system prune -af >/dev/null 2>&1 & \
            wait )
          avail_kb=$(df --output=avail / | tail -1)
          df -h / | tail -1
          if [ "$avail_kb" -lt 26000000 ]; then
            echo "Still under ~25 GB free: falling back to the slow apt cleanup"
            sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri >/dev/null 2>&1 || true
            sudo apt-get autoremove -y >/dev/null 2>&1 || true
            df -h / | tail -1
          fi


      - if: needs.changes.outputs.player == 'true'
        uses: actions/checkout@v4
        with:
          lfs: true

      # One shared Android Library cache for both ABIs (about 3 GB instead of
      # two 3 GB entries). The arm64 job saves it on main; both ABIs restore.
      - if: needs.changes.outputs.player == 'true'
        name: Restore Library cache (Android, shared by both ABIs)
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}
          restore-keys: |
            Library-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-

      # The Unity container runs with HOME=/github/home, which the action
      # maps to RUNNER_TEMP/_github_home; Gradle's cache lives under it.
      # (Unverified until the first main run saves it; an empty path is
      # skipped silently by actions/cache.)
      - if: needs.changes.outputs.player == 'true'
        name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/_github_home/.gradle
          key: gradle-android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}
          restore-keys: |
            gradle-android-

      - if: needs.changes.outputs.player == 'true'
        name: Build ${{ matrix.abi }} APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: LightShadow.Tools.SceneBuilder.${{ matrix.method }}

      - if: needs.changes.outputs.player == 'true'
        name: Upload ${{ matrix.abi }} APK
        uses: actions/upload-artifact@v7
        with:
          name: LightShadow-android-${{ matrix.abi }}
          path: Builds/Android/${{ matrix.abi }}/LightShadow.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - if: success() && needs.changes.outputs.player == 'true' && github.ref == 'refs/heads/main' && matrix.abi == 'arm64-v8a'
        name: Save Library cache (main, arm64 job only)
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}

      - if: success() && needs.changes.outputs.player == 'true' && github.ref == 'refs/heads/main' && matrix.abi == 'arm64-v8a'
        name: Save Gradle cache (main, arm64 job only)
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/_github_home/.gradle
          key: gradle-android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}

  build-windows:
    name: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    steps:
      - if: needs.changes.outputs.player == 'true'
        name: Free runner disk space (fast parallel rm; apt purge only if still short)
        run: |
          df -h / | tail -1
          sudo swapoff -a || true
          ( sudo rm -rf /usr/local/lib/android & \
            sudo rm -rf /usr/share/dotnet & \
            sudo rm -rf /opt/ghc /usr/local/.ghcup & \
            sudo rm -rf /usr/share/swift /usr/local/share/boost & \
            docker system prune -af >/dev/null 2>&1 & \
            wait )
          avail_kb=$(df --output=avail / | tail -1)
          df -h / | tail -1
          if [ "$avail_kb" -lt 26000000 ]; then
            echo "Still under ~25 GB free: falling back to the slow apt cleanup"
            sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri >/dev/null 2>&1 || true
            sudo apt-get autoremove -y >/dev/null 2>&1 || true
            df -h / | tail -1
          fi


      - if: needs.changes.outputs.player == 'true'
        uses: actions/checkout@v4
        with:
          lfs: true

      - if: needs.changes.outputs.player == 'true'
        name: Restore Library cache (StandaloneWindows64)
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}
          restore-keys: |
            Library-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-StandaloneWindows64-

      - if: needs.changes.outputs.player == 'true'
        name: Build Windows player (StandaloneWindows64, Mono — project default backend)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: auto
          customImage: unityci/editor:ubuntu-6000.4.0f1-windows-mono-4.0.0
          buildMethod: LightShadow.Tools.SceneBuilder.BuildWindowsBatch

      - if: needs.changes.outputs.player == 'true'
        name: Upload Windows player
        uses: actions/upload-artifact@v7
        with:
          name: LightShadow-windows
          path: Builds/Windows/
          if-no-files-found: error
          retention-days: 14

      - if: success() && needs.changes.outputs.player == 'true' && github.ref == 'refs/heads/main'
        name: Save Library cache (main only)
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}

  release:
    name: release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LightShadow-*
          path: artifacts

      # Both APKs are named LightShadow.apk inside their per-ABI artifacts —
      # rename them so release assets are distinguishable.
      - name: Rename APKs per ABI and zip the Windows player folder
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mv "artifacts/LightShadow-android-$abi/LightShadow.apk" "artifacts/LightShadow-$abi.apk"
          done
          cd artifacts/LightShadow-windows
          zip -qr ../LightShadow-windows.zip .
          cd ../..
          ls -la artifacts

      - name: Attach builds to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/LightShadow-windows.zip
            artifacts/LightShadow-arm64-v8a.apk
            artifacts/LightShadow-armeabi-v7a.apk
